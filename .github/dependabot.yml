# Scheduled dependency updates.
#
# Security alerts arrive without this file; scheduled *version* updates do not.
# Their absence is why zod 4.4.3 sat at a high-severity advisory with no alert
# raised until `npm audit` was run by hand on 2026-11-01.
#
# Updates are grouped deliberately. Every lockfile change invalidates the three
# endocrine quality receipts in scripts/quality-dependencies.json that pin a
# SHA-256 of package-lock.json, so each pull request costs a manual receipt
# refresh plus a full ~50-minute suite. One grouped pull request per week is far
# cheaper than one per package, so minor and patch updates travel together and
# only majors — which want individual review anyway — arrive alone.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Denver
    # Low, because each open pull request carries the receipt-refresh chore.
    open-pull-requests-limit: 3
    groups:
      # First match wins, so eslint's minor and patch updates still ride along
      # with everything else. Only the majors need coordinating, below.
      npm-minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]
      # eslint and @eslint/js must cross a major together: @eslint/js 10.0.1
      # declares peer `eslint ^10.0.0`, so a lone @eslint/js bump (#15) was
      # unmergeable by construction against eslint 9. Grouping them means the
      # next major arrives as one coherent pull request.
      eslint:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', '@typescript-eslint/*']
    # Conventional Commits, matching the history: `build(deps-dev): bump vite …`.
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    ignore:
      # Held at 1.10.x on purpose, not abandoned. 1.15.0 makes `validate --strict`
      # fail on warnings, so 11 of 30 specs fail on the "requirement text is very
      # long (>500 characters)" advice alone — unchanged spec files, 30/30 under
      # 1.10.0 and 19/30 under 1.15.0. Splitting those requirements is worth doing
      # and is scheduled; until then this stops one preference from blocking every
      # other update in the group. Patches to 1.10.x still come through.
      # Remove this entry once the long requirements are split.
      - dependency-name: '@fission-ai/openspec'
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      # TypeScript majors are blocked upstream, not here. typescript-eslint
      # refuses TS 7 outright — "typescript-eslint does not support TS 7.0" —
      # and its peer range is `>=4.8.4 <6.1.0`, so `npm ci` fails ERESOLVE
      # before any script runs. Tracked at
      # https://github.com/typescript-eslint/typescript-eslint/issues/10940
      # for TS >=7.1. The source itself is ready: under TS 7.0.2 this
      # repository typechecks with zero errors once tsconfig drops baseUrl,
      # which this change does. Remove this entry once typescript-eslint
      # supports TS 7, and the bump should then be a version change alone.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  # The runner already warns that actions/checkout@v4 and actions/setup-node@v4
  # target the deprecated Node 20 and are being forced onto Node 24.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
