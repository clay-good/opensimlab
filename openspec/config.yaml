schema: spec-driven

context: |
  Project: Open Sim Lab (opensimlab.com) — an open-source, browser-native clinical
  simulator. First module is Anesthesiology at /anesthesia; later modules mount at
  /oncology, /cardiology, and so on.

  The goal is the best anesthesia education on the internet. Not a tech demo, not a
  dataset viewer — a thing a medical student opens the night before their first OR day
  and comes out of understanding something they did not understand before.

  Audience, in priority order: medical students on an anesthesia rotation; residents in
  their first year; nurse anesthetist students; anyone teaching them.

  Product principles:
    - Zero login, zero install, sub-second first interaction.
    - 100% client-side: nothing a learner does leaves their device, ever.
    - Deterministic physiology with real published pharmacology behind it.
    - One theme, built once, built well. No theme switcher, no light mode.
    - Usable by ANY medical student: offline, low-end Android, 2G, screen reader,
      colorblind-safe, translated, both SI and conventional units.

  Tech stack: TypeScript, Vite, React 19, CSS custom properties + Tailwind, Zustand,
  HTML5 Canvas 2D, Web Worker for the solver, Service Worker for offline. Static assets
  only, served from the edge by an assets-only Cloudflare Worker. No backend, no database, no analytics vendor.

  Pharmacology: model parameters are transcribed BY HAND from the primary literature
  into typed TypeScript source in this repository, each carrying its citation and its
  applicability envelope, double-sourced and independently checked before being marked
  verified. Named models include Marsh 1991, Schnider 1998, Eleveld 2018, Minto 1997,
  Shafer 1990, Hannivoort 2015, and Nickalls & Mapleson 2003 for age-related MAC. The
  sibling project Hypnos (github.com/clay-good/hypnos) is a cross-check during authoring
  and nothing more — NOT a dependency, NOT vendored, NOT imported. We own our numbers.

  Grounding: this only matters if clinicians trust it, so the specs bind the product to
  the published evidence and to the standards clinicians already know —
    - Varvel 1992 (PMID 1588504) for predictive performance: MDPE, MDAPE, wobble, divergence.
    - Benumof 1997 (PMID 9357902) for apnea desaturation times.
    - IEC 60601-1-8 for alarm priority, color, and flash rate.
    - ASA Standards for Basic Anesthetic Monitoring for the monitored parameter set.
    - MHAUS, ASRA 2020 LAST (PMID 33148630), 2022 ASA difficult airway (PMID 34762729),
      2023 ASA neuromuscular blockade guidelines for crisis protocols.
    - NAP5 (awareness) and NAP6 (anaphylaxis) for crisis epidemiology.
    - PEARLS (Eppich & Cheng 2015, PMID 25710312) for debriefing structure.
    - INACSL Healthcare Simulation Standards of Best Practice for simulation design.
    - ACGME Anesthesiology Milestones 2.0 and COA/NBCRNA domains for curriculum mapping.
  Every clinical assertion is signed by a named credentialed reviewer with declared
  interests, tracked for currency, and correctable through a public log.

  Depth of anesthesia is a PREDICTED index from a published PD model, never a claim to
  reproduce a commercial monitor. BIS is a Medtronic trademark; use it only nominatively
  to name the scale a published model was fitted to, never as our display's name.

  Waveforms are generated from published methods, not hand-drawn: the ECG uses the
  McSharry et al. 2003 ODE model (PMID 12669985), implemented FROM THE PAPER — never
  copied from the GPL PhysioNet ECGSYN code, which would contaminate our license.

  Practice varies by country and teaching a technique a learner cannot legally use is a
  defect. Target-controlled infusion is routine in the UK/EU/Australia and is NOT
  FDA-approved for routine use in the US. Practice region is a first-class setting that
  governs technique availability, formulary, protocol variant, units, and terminology.

  Sound is not decoration. The variable-pitch pulse tone (pitch falls as SpO2 falls, per
  ISO 80601-2-61) is how anesthetists actually track saturation, and it doubles as the
  strongest accessibility affordance we have. Audio is opt-in and never the only channel.

  The front door at opensimlab.com is one short, tasteful page: live ECG hero, one button into
  /anesthesia, honest module directory (Cardiology and others marked Planned, no dates). ALL the
  descriptive prose and search metadata lives on the root domain; /anesthesia carries only
  essential metadata and never marketing copy. Every indexable route is prerendered static HTML.
  Search is measured only via a webmaster console — never a script on the page.

  Sustainability is an adoption question, not an afterthought. A program adopting this is
  making a multi-year bet; state the bus factor, the succession path, the dependency
  ceiling, and the funding disclosure honestly.

  Regulatory position: educational training software, not a medical device. The FDA lists
  training simulation software among examples of software functions that are not devices.
  Design so that stays true.

  Design: ONE dark theme. Its organizing rule is that COLOR IS A CLINICAL SIGNAL, NEVER
  DECORATION. Interface chrome is a neutral ramp; the only saturated color on screen is
  physiology (five trace hues), alarm severity, and a single focus accent.

  Hard safety rule: Open Sim Lab is an educational simulator. It is NOT a clinical
  decision-support tool, NOT a dosing calculator, and NOT validated for any decision
  affecting a real patient.

  Conventions: conventional commits; American English; SI units internally with a
  display-layer conversion; all times in simulated seconds from scenario start.

rules:
  specs:
    - Every requirement must be independently testable by an automated test or a
      documented manual procedure. Avoid unmeasurable words like "fast" or "intuitive".
    - Quantify thresholds. Give numbers, units, and tolerances.
    - Where a requirement encodes clinical content, name the published source it
      derives from.
    - Where a requirement encodes visual design, name the exact token, value, or
      measurement. A builder should never have to guess a color, size, or duration.
    - Prefer failure-mode scenarios alongside happy-path scenarios.
